{% extends "base.html" %}{% block content %}<div class="row"><h1>Productos</h1><a class="btn" href="/">Inicio</a></div><div class="table-wrap card"><table class="table"><thead><tr><th>Categoría</th><th>Producto</th><th>Formato</th><th>Precio IVA incl.</th></tr></thead><tbody>{% for p in products %}<tr><td>{{p.category}}</td><td><strong>{{p.name}}</strong><div class="muted">{{p.sku}}</div></td><td>{{p.format}}</td><td class="money">{{p.price_gross_clp|clp}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
