{% extends "base.html" %}{% block content %}<div class="row"><h1>Prospectos</h1><a class="btn btn-primary" href="/web-search">+ Buscar</a></div><form class="form card" method="get"><select name="status" onchange="this.form.submit()"><option value="">Todos los estados</option>{% for s in statuses %}<option {% if status_filter==s.value %}selected{% endif %}>{{s.value}}</option>{% endfor %}</select></form><div class="list" style="margin-top:12px">{% for p in prospects %}<a class="card row" href="/prospects/{{p.id}}"><div><strong>{{p.company_name}}</strong><div class="muted">{{p.industry or 'Sin rubro'}} · {{p.commune or p.city or 'Sin sector'}}</div><div class="muted">{{p.phone or p.email or p.instagram or ''}}</div></div><span class="pill">{{p.status.value}}</span></a>{% else %}<div class="card">Sin resultados.</div>{% endfor %}</div>{% endblock %}
